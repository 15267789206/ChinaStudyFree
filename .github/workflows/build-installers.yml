# 修正版：仅构建 iOS 未签名 IPA（聪聪学堂 ChinaStudyFree）
# 修复：官方 workflow 的 iOS job 漏了 `npx cap add ios`（ios/ 目录被 gitignore，
# cap sync 直接跑会报 platform not found），本版本已补上；
# 同时去掉 pod install 的 `|| true`（避免静默失败导致后续 xcodebuild 报错）。
# 用法：fork 仓库后，用本文件替换 .github/workflows/build-installers.yml，
# 再到 Actions 页手动触发（Run workflow）。
on:
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # ── Web 静态站 + 前端数据（iOS 打包的前置产物）──
  web:
    name: Web 静态站 + 前端数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 生成前端数据（output/ → public/data）
        run: npm run build:data
      - name: 抓取教材目录（ChinaTextbook）
        run: npm run sync:textbooks
        continue-on-error: true
      - name: 构建静态站
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 7

  # ── iOS 未签名 IPA（macOS 云编译）──
  ios:
    name: iOS 未签名 IPA
    needs: web
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: npm ci --ignore-scripts
      - name: 添加并同步 iOS 工程（补 cap add ios）
        working-directory: apps/mobile
        run: | npx cap add ios npx cap sync ios       - name: 安装 CocoaPods 依赖
        working-directory: apps/mobile/ios/App
        run: pod install --repo-update
      - name: 归档（不签名）
        working-directory: apps/mobile/ios/App
        run: | xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \ -sdk iphoneos -derivedDataPath build \ CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \ build       - name: 打包为 IPA（Payload 结构，未签名）
        working-directory: apps/mobile/ios/App
        run: | mkdir -p Payload cp -R build/Build/Products/Release-iphoneos/App.app Payload/ zip -qry ChinaStudyFree-ios-unsigned.ipa Payload       - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/ios/App/ChinaStudyFree-ios-unsigned.ipa
          retention-days: 30
